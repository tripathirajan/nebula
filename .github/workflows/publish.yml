name: Publish Package
run-name: "Publish - manual"

# Dispatch this against the `release` branch, not `main`. `main`'s
# branch protection requires a PR review for every push, which
# github-actions[bot] can't satisfy (enforce_admins only exempts human
# admins) — the "Push version commit and tags" step below would fail
# every time on `main` (confirmed: GH006 "Protected branch update
# failed"). `release` has no protection rule, so the bot can push its
# own version-bump commits and tags directly. See CONTRIBUTING.md's
# "Publishing" section for the full release/hotfix flow.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for Nx release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: "Prerelease identifier (only applied when bump is 'prerelease', e.g. beta -> 0.2.0-beta.0)"
        required: false
        default: beta
        type: string
      tag:
        description: "Optional npm dist-tag"
        required: false
        default: latest
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish:
    name: Version, tag, and publish only the packages that actually changed
    runs-on: ubuntu-latest
    environment: npm
    env:
      # See ci.yml — authenticates `nx release`'s underlying `build` step
      # against Nx Cloud for remote caching; harmless no-op if unset.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine which packages to release
        id: projects
        # `nx.json`'s `release.projectsRelationship: "independent"` means
        # each package already carries its own version — but `nx release
        # version <bump>` with no `--projects` filter still bumps *every*
        # project by the same amount regardless of whether it actually
        # changed (confirmed: this is why every package has shipped in
        # lockstep so far despite being versioned independently). This step
        # computes the real subset to release instead — see
        # `.github/scripts/determine-release-projects.mjs`'s own doc
        # comment for the exact two-step rule (each package diffed against
        # its *own* last release tag, not one repo-wide base, plus the
        # foundational-package cascade to `react-ui`/`react-ui-blocks`) and
        # why it deliberately doesn't use `nx show projects --affected`.
        run: |
          PROJECTS=$(node .github/scripts/determine-release-projects.mjs)

          echo "Releasing: $PROJECTS"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "has_projects=$([ -n "$PROJECTS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Version affected packages with Nx
        if: steps.projects.outputs.has_projects == 'true'
        # Only stages the package.json changes — it does not commit them.
        # That's fine: build/publish below read the bumped versions
        # straight off disk, and "Generate changelog and tag release"
        # further down commits both this version bump and the changelog
        # files together in one commit, once publish has actually
        # succeeded.
        run: pnpm nx release version "${{ github.event.inputs.bump }}" --preid "${{ github.event.inputs.preid }}" --projects="${{ steps.projects.outputs.projects }}"

      - name: Build packages
        if: steps.projects.outputs.has_projects == 'true'
        run: pnpm build

      - name: Publish packages with Nx
        if: steps.projects.outputs.has_projects == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nx release publish --yes --tag "${{ github.event.inputs.tag }}" --projects="${{ steps.projects.outputs.projects }}"

      - name: Generate changelog and tag release
        # Runs only once publish actually succeeds, so a build/publish
        # failure never leaves a version bump or changelog committed for
        # something that was never really published. Delegates to
        # `.github/scripts/generate-changelogs.mjs` — `nx release
        # changelog` requires an explicit `[version]` positional when run
        # directly, which doesn't exist as a single value across
        # independently-versioned projects, so the script calls it once
        # per released project with that project's own version (confirmed
        # necessary: the previous single `--projects=...` call with no
        # version failed with "An explicit target version must be
        # specified"). Also creates the git tags `nx release version`
        # doesn't create on its own, and (via `nx.json`'s
        # `release.changelog.projectChangelogs.createRelease = "github"`) a
        # real GitHub Release per released project's tag — needs
        # `GITHUB_TOKEN` to call the GitHub API for that. Doesn't push yet
        # — the next step does that once this succeeds.
        if: steps.projects.outputs.has_projects == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-changelogs.mjs "${{ steps.projects.outputs.projects }}"

      - name: Push version commit, changelog, and tags
        if: steps.projects.outputs.has_projects == 'true'
        run: git push --follow-tags

      - name: No changed packages
        if: steps.projects.outputs.has_projects != 'true'
        run: echo "No package has changed since the last release — nothing to publish."
