name: Fix dist-tags (one-off)
run-name: "Fix dist-tags - manual"

# Temporary, one-off maintenance workflow — moves the `latest` npm dist-tag
# back to a real published version after earlier publish runs left it
# pointing at a prerelease (see the "Generate changelog and tag release"
# failure investigated in this session: the publish step itself succeeded
# each time, but the git commit/tag/push step after it failed, so
# subsequent runs kept computing prerelease bumps off stale on-disk
# versions instead of what was actually live). Not meant to be a permanent
# part of this repo's CI — delete this file once it's run successfully.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix-dist-tags:
    name: Move latest dist-tag back to 2.0.0
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Move latest to 2.0.0 for all three packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm dist-tag add @nebula-lab/primitives@2.0.0 latest
          npm dist-tag add @nebula-lab/react-ui@2.0.0 latest
          npm dist-tag add @nebula-lab/react-ui-blocks@2.0.0 latest

      - name: Verify
        run: |
          npm dist-tag ls @nebula-lab/primitives
          npm dist-tag ls @nebula-lab/react-ui
          npm dist-tag ls @nebula-lab/react-ui-blocks
